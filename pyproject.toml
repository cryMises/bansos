[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bansos"
version = "0.1.0"
description = "Local-first catalog for researching legitimately free technology resources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["sqlite", "cli", "local-first", "research", "free-resources"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Utilities",
]

[project.scripts]
bansos = "bansos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
